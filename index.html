<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Paint Studio</h1>
            <p>Полотно для швидких ескізів</p>
          </div>
        </div>

        <div class="document-controls" aria-label="Розмір полотна">
          <label>
            <span>Ширина</span>
            <input id="canvasWidth" type="number" min="240" max="3000" step="10" value="1280" />
          </label>
          <label>
            <span>Висота</span>
            <input id="canvasHeight" type="number" min="180" max="2200" step="10" value="780" />
          </label>
          <button id="resizeCanvas" class="button secondary" type="button">Застосувати</button>
        </div>

        <div class="file-actions" aria-label="Файл">
          <label class="button secondary file-button" title="Відкрити зображення">
            <input id="imageLoader" type="file" accept="image/*" />
            <span>Відкрити</span>
          </label>
          <button id="downloadPng" class="button primary" type="button">Зберегти PNG</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="tool-panel" aria-label="Інструменти">
          <section class="panel-section">
            <h2>Інструменти</h2>
            <div class="tool-grid" id="toolGrid">
              <button class="tool-button is-active" type="button" data-tool="brush" title="Пензель" aria-label="Пензель">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m4 20 4.2-1.1L19.1 8a2.4 2.4 0 0 0 0-3.4 2.4 2.4 0 0 0-3.4 0L4.8 15.5 4 20Z" />
                    <path d="m13.8 6.5 3.7 3.7" />
                    <path d="m7.5 15.8 2.7 2.7" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="eraser" title="Гумка" aria-label="Гумка">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m3.5 14.5 8.4-8.4a2 2 0 0 1 2.8 0l5.8 5.8a2 2 0 0 1 0 2.8L15.2 20H8.1l-4.6-4.6a.7.7 0 0 1 0-.9Z" />
                    <path d="m9.3 8.7 6 6" />
                    <path d="M15.2 20H21" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="bucket" title="Заливка" aria-label="Заливка">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m6 4 11 11-5 5L1 9l5-5Z" />
                    <path d="m6 4 2.5-2.5" />
                    <path d="M14.5 12.5H22" />
                    <path d="M19 17c1.4 1.6 2 2.8 2 3.5a2 2 0 0 1-4 0c0-.7.6-1.9 2-3.5Z" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="picker" title="Піпетка" aria-label="Піпетка">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m14.5 5 4.5 4.5" />
                    <path d="m16.8 2.7 4.5 4.5-11 11H6.8v-3.5l10-10Z" />
                    <path d="M6.8 18.2 4 21" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="line" title="Лінія" aria-label="Лінія">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 19 19 5" />
                    <path d="M4 20h4" />
                    <path d="M16 4h4" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="rect" title="Прямокутник" aria-label="Прямокутник">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="5" y="6" width="14" height="12" rx="1.5" />
                    <path d="M8 3h8" />
                    <path d="M8 21h8" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="ellipse" title="Еліпс" aria-label="Еліпс">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <ellipse cx="12" cy="12" rx="8" ry="6.5" />
                    <path d="M7 6.8C8.3 5.7 10 5 12 5" />
                    <path d="M17 17.2c-1.3 1.1-3 1.8-5 1.8" />
                  </svg>
                </span>
              </button>
              <button class="tool-button" type="button" data-tool="text" title="Текст" aria-label="Текст">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 5h14" />
                    <path d="M12 5v14" />
                    <path d="M9 19h6" />
                  </svg>
                </span>
              </button>
            </div>
          </section>

          <section class="panel-section shapes-section">
            <h2>Фігури</h2>
            <div class="shape-grid" id="shapeGrid" aria-label="Фігури"></div>
          </section>

          <section class="panel-section">
            <h2>Пензель</h2>
            <label class="range-row">
              <span>Розмір</span>
              <output id="sizeOutput">8</output>
              <input id="brushSize" type="range" min="1" max="72" value="8" />
            </label>
            <label class="range-row">
              <span>Прозорість</span>
              <output id="opacityOutput">100%</output>
              <input id="opacity" type="range" min="5" max="100" value="100" />
            </label>
            <div class="toggle-row">
              <label>
                <input id="fillShape" type="checkbox" />
                <span>Заливка фігур</span>
              </label>
            </div>
          </section>

          <section class="panel-section">
            <h2>Колір</h2>
            <div class="color-pair">
              <label>
                <span>Основний</span>
                <input id="primaryColor" type="color" value="#1f2937" />
              </label>
              <label>
                <span>Фон</span>
                <input id="backgroundColor" type="color" value="#ffffff" />
              </label>
            </div>
            <div class="swatches" id="swatches" aria-label="Швидкі кольори"></div>
          </section>

          <section class="panel-section">
            <h2>Дії</h2>
            <div class="action-grid">
              <button id="undo" class="button secondary" type="button">Скасувати</button>
              <button id="redo" class="button secondary" type="button">Повторити</button>
              <button id="clearCanvas" class="button danger" type="button">Очистити</button>
            </div>
          </section>
        </aside>

        <section class="canvas-stage" aria-label="Робоча область">
          <div class="stage-toolbar">
            <div class="status-line" id="statusLine">Пензель · 1280 × 780</div>
            <div class="zoom-controls" aria-label="Масштаб">
              <button id="zoomOut" class="icon-button" type="button" title="Зменшити" aria-label="Зменшити">−</button>
              <span id="zoomLabel">100%</span>
              <button id="zoomIn" class="icon-button" type="button" title="Збільшити" aria-label="Збільшити">+</button>
              <button id="fitCanvas" class="button secondary" type="button">Вписати</button>
            </div>
          </div>

          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="paintCanvas" width="1280" height="780"></canvas>
            <input id="textInput" class="text-input" type="text" autocomplete="off" />
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
